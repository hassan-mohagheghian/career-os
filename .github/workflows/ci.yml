name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.14"

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jobsearch
          POSTGRES_PASSWORD: jobsearch
          POSTGRES_DB: jobsearch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run Alembic migrations
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://jobsearch:jobsearch@localhost:5432/jobsearch

      - name: Lint with ruff
        run: uv run ruff check apps/backend || true

      - name: Type check with mypy
        run: uv run mypy apps/backend --ignore-missing-imports || true

      - name: Run backend tests
        run: uv run pytest apps/backend/tests/ -v --tb=short --cov=apps.backend --cov-report=term-missing --cov-report=html
        env:
          DATABASE_URL: postgresql+psycopg://jobsearch:jobsearch@localhost:5432/jobsearch
          REDIS_HOST: localhost
          REDIS_PORT: 6379

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/frontend

      - name: Run frontend tests
        run: npm test
        working-directory: apps/frontend

      - name: Build frontend
        run: npm run build
        working-directory: apps/frontend
