name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.14"

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jobsearch
          POSTGRES_PASSWORD: jobsearch
          POSTGRES_DB: jobsearch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run Alembic migrations
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://jobsearch:jobsearch@localhost:5432/jobsearch

      - name: Lint with ruff
        run: uv run ruff check apps/backend || true

      - name: Check version consistency
        run: ./scripts/check-version.sh

      - name: Type check with mypy
        run: uv run mypy apps/backend --ignore-missing-imports || true

      - name: Run backend tests
        run: uv run pytest apps/backend/tests/ -v --tb=short --junitxml=test-results/pytest.xml --cov=apps/backend --cov-report=term-missing --cov-report=xml:coverage.xml --cov-report=json:coverage.json --cov-report=html
        env:
          DATABASE_URL: postgresql+psycopg://jobsearch:jobsearch@localhost:5432/jobsearch
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Publish backend test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: pytest
          path: test-results/pytest.xml
          reporter: java-junit
          fail-on-error: 'false'

      - name: Summarize backend coverage
        if: always()
        run: |
          uv run python - <<'EOF'
          import json
          import os

          path = os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null')
          try:
              with open('coverage.json') as f:
                  data = json.load(f)
          except (FileNotFoundError, json.JSONDecodeError):
              with open(path, 'a') as f:
                  f.write('## Backend Coverage\n\nNo coverage report produced.\n')
              raise SystemExit(0)

          totals = data['totals']
          pct = totals['percent_covered']
          stmts = totals['num_statements']
          covered = totals['covered_lines']
          missing = totals['missing_lines']
          branches = totals.get('num_branches', 0)
          covered_branches = totals.get('covered_branches', 0)

          with open(path, 'a') as f:
              f.write('## Backend Coverage\n\n')
              f.write(f'**Total: {pct:.2f}%** — {covered}/{stmts} lines covered, {missing} missing\n')
              if branches:
                  f.write(f'Branches: {covered_branches}/{branches}\n')
          EOF

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            test-results/pytest.xml
            coverage.xml
            coverage.json
            htmlcov/
          retention-days: 7

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/frontend

      - name: Run frontend tests
        run: npm test
        working-directory: apps/frontend

      - name: Build frontend
        run: npm run build
        working-directory: apps/frontend
