name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run backend tests
        working-directory: app/server
        run: uv run pytest tests/ -v --tb=short --cov=services --cov=blueprints --cov=core --cov-report=term-missing --cov-report=html

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: app/client/package-lock.json

      - name: Install dependencies
        working-directory: app/client
        run: npm ci

      - name: Build frontend
        working-directory: app/client
        run: npm run build
