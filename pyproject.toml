[project]
name = "job-search"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-socketio>=5.0",
    "structlog>=24.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13",
    "websockets>=12.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
ai = [
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=4.3.1",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
jobsearch = "app.server.entrypoints.cli:app"

[tool.pytest.ini_options]
testpaths = ["app/server/tests"]
addopts = "--tb=short -q"

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
]
test = [
    "httpx2>=2.9.1",
]
