[project]
name = "job-search"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "flask-socketio>=5.3",
    "structlog>=24.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13",
    "websockets>=12.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
jobsearch = "app.server.cli:app"

[tool.pytest.ini_options]
testpaths = ["app/server/tests"]
addopts = "--tb=short -q"
