[project]
name = "job-search"
version = "3.3.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-socketio>=5.0",
    "structlog>=24.0",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13",
    "websockets>=12.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "taskiq>=0.12",
    "taskiq-redis>=1.2",
    "redis>=5.0",
    "langchain>=1.3.14",
    "httpx>=0.28.1",
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "psycopg>=3.2",
    "psycopg-binary>=3.2",
]

[project.optional-dependencies]
ai = [
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=4.3.1",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
jobsearch = "apps.backend.entrypoints.cli:app"
start = "apps.start:app"

[tool.pytest.ini_options]
testpaths = ["apps/backend/tests"]
addopts = "--tb=short -q -m 'not slow'"
markers = [
    "slow: tests that take longer than 2s and are skipped in normal runs",
]
filterwarnings = [
    "ignore::DeprecationWarning:sqlalchemy.*",
    "ignore::ResourceWarning",
    "ignore:The default datetime adapter is deprecated:DeprecationWarning",
    "ignore:pending_generations is deprecated:DeprecationWarning",
    "ignore:pending models are deprecated:DeprecationWarning",
]

[dependency-groups]
dev = [
    "coverage>=7.15.2",
    "httpx2>=2.9.1",
    "pytest-cov>=7.1.0",
]
test = [
    "httpx2>=2.9.1",
    "pytest-timeout>=2.4.0",
]

[tool.coverage.run]
source = ["apps/backend"]
omit = [
    "apps/backend/tests/*",
    "apps/backend/**/__init__.py",
    "apps/backend/db/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
